<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məbləğin Xırdalanması</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #008080;
        }

        .main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Sol Narıncı Panel */
        .panel-sol {
            width: 350px;
            min-width: 350px;
            background-color: #ff8000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 35px;
            position: relative;
            border-right: 1px solid #c86400;
        }

        .splitter-handle {
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 9px;
            height: 9px;
            background: #fff;
            border: 1px solid #333;
            z-index: 20;
        }

        .group-mebleg {
            margin-bottom: 25px;
            position: relative;
        }

        .lbl-xirdalanacaq {
            font-size: 16px;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
            display: block;
        }

        .input-row {
            position: relative;
            display: flex;
            align-items: center;
        }

        .txt-input {
            width: 100%;
            height: 34px;
            font-size: 16px;
            padding: 2px 8px;
            border: 1px solid #555;
            background: #ffffff;
            color: #000;
            outline: none;
        }

        .txt-input:focus {
            border-color: #000;
        }

        /* ErrorProvider */
        .error-provider-badge {
            display: none;
            position: absolute;
            right: -24px;
            width: 18px;
            height: 18px;
            background: #d8000c;
            color: white;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            line-height: 18px;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(216,0,12,0.8);
            animation: pulse 1s infinite alternate;
            z-index: 50;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.9; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .error-provider-tooltip {
            display: none;
            position: absolute;
            left: 105%;
            top: -5px;
            background: #fffbe6;
            color: #333;
            border: 1px solid #d4b106;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 12px;
            white-space: nowrap;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
            z-index: 100;
        }

        .error-provider-badge:hover + .error-provider-tooltip {
            display: block;
        }

        .btn-xirdala {
            height: 48px;
            background-color: #e1e1e1;
            border: 1px solid #707070;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: background 0.15s;
        }

        .btn-xirdala:hover {
            background-color: #d6d6d6;
        }

        .btn-xirdala:active {
            background-color: #cccccc;
        }

        /* Sağ Firuzəyi (Teal) Panel */
        .panel-sag {
            flex: 1;
            background-color: #008080;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 20px 40px;
            gap: 15px 40px;
            align-content: space-between;
        }

        .slot {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 110px;
            transition: opacity 0.2s ease;
        }

        /* Designer selection style box around banknote */
        .box-wrapper {
            position: relative;
            border: 1px dashed rgba(255, 255, 255, 0.45);
            padding: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
        }

        .img-eskinas {
            width: 195px;
            height: 104px;
            object-fit: fill;
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .lbl-say {
            font-size: 17px;
            font-weight: bold;
            color: #ffffff;
            min-width: 60px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Windows MessageBox Modal */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .message-box {
            width: 380px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid #ccc;
            overflow: hidden;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .mb-header {
            background: #f0f0f0;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mb-body {
            padding: 22px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .warning-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0ad4e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .mb-text {
            font-size: 14px;
            color: #222;
            line-height: 1.4;
        }

        .mb-footer {
            background: #f7f7f7;
            padding: 10px 16px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #e5e5e5;
        }

        .mb-btn {
            padding: 6px 24px;
            background: #e1e1e1;
            border: 1px solid #adadad;
            font-size: 13px;
            cursor: pointer;
            border-radius: 2px;
        }

        .mb-btn:hover {
            background: #e5f1fb;
            border-color: #0078d7;
        }
    </style>
</head>
<body>

                    <div id="errorTooltip" class="error-provider-tooltip">Məbləğ daxil edin</div>
                </div>
            </div>
            <button type="button" id="btnXirdala" class="btn-xirdala">Xırdala</button>
        </div>

        <div id="modalOverlay" class="modal-overlay">

                <div class="mb-header">
                    <span id="mbTitle">Diqqət</span>
                    <span style="cursor:pointer;" onclick="closeModal()">✕</span>
                </div>
                <div class="mb-body">

    <script>
        const txtMebleg = document.getElementById('txtMebleg');
        const btnXirdala = document.getElementById('btnXirdala');
        const errorBadge = document.getElementById('errorBadge');
        const errorTooltip = document.getElementById('errorTooltip');
        const modalOverlay = document.getElementById('modalOverlay');
        const mbText = document.getElementById('mbText');
        const mbTitle = document.getElementById('mbTitle');

        const slots = {
            1: document.getElementById('slot-1'),
            5: document.getElementById('slot-5'),
            10: document.getElementById('slot-10'),
            20: document.getElementById('slot-20'),
            50: document.getElementById('slot-50'),
            100: document.getElementById('slot-100'),
            200: document.getElementById('slot-200'),
            500: document.getElementById('slot-500')
        };

        const labels = {
            1: document.getElementById('label1'),
            5: document.getElementById('label2'),
            10: document.getElementById('label3'),
            20: document.getElementById('label4'),
            50: document.getElementById('label5'),
            100: document.getElementById('label6'),
            200: document.getElementById('label7'),
            500: document.getElementById('label8')
        };

        function showModal(msg, title = 'Diqqət') {
            mbText.textContent = msg;
            mbTitle.textContent = title;
            modalOverlay.style.display = 'flex';
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
            txtMebleg.focus();
        }

        // Məbləğ daxil edildikdə errorprovider öz işini yekunlaşdırır
        txtMebleg.addEventListener('input', () => {
            if (txtMebleg.value.trim() !== '') {
                errorBadge.style.display = 'none';
                errorTooltip.style.display = 'none';
            }
        });

        btnXirdala.addEventListener('click', () => {
            const val = txtMebleg.value.trim();

            // 1. ErrorProvider: xananın boş olmasının yoxlanılması
            if (val === '') {
                errorBadge.style.display = 'block';
                errorTooltip.style.display = 'block';
                return;
            } else {
                errorBadge.style.display = 'none';
                errorTooltip.style.display = 'none';
            }

            // 2. Ədədin düzgünlüyü
            const num = Number(val);
            if (isNaN(num) || !Number.isInteger(num)) {
                showModal('Zəhmət olmasa düzgün tam ədəd daxil edin!', 'Diqqət');
                return;
            }

            // 3. Mənfi və ya sıfır məbləğ yoxlanışı
            if (num <= 0) {
                showModal('Mənfi və ya sıfır məbləğ xırdalanmaz', 'Diqqət');
                return;
            }

            // 4. Ən böyük nominallardan başlayaraq xırdalama
            let qaliq = num;

            const say500 = Math.floor(qaliq / 500); qaliq %= 500;
            const say200 = Math.floor(qaliq / 200); qaliq %= 200;
            const say100 = Math.floor(qaliq / 100); qaliq %= 100;
            const say50  = Math.floor(qaliq / 50);  qaliq %= 50;
            const say20  = Math.floor(qaliq / 20);  qaliq %= 20;
            const say10  = Math.floor(qaliq / 10);  qaliq %= 10;
            const say5   = Math.floor(qaliq / 5);   qaliq %= 5;
            const say1   = Math.floor(qaliq / 1);   qaliq %= 1;

            const results = {
                500: say500,
                200: say200,
                100: say100,
                50:  say50,
                20:  say20,
                10:  say10,
                5:   say5,
                1:   say1
            };

            // 5. Yalnız lazım olan əskinaslar və onların sayı görünsün
            // Hansı əskinas istifadə olunarsa onun özü və qarşısındakı sayı aktiv olsun
            for (let nominal in results) {
                const count = results[nominal];
                if (count > 0) {
                    slots[nominal].style.visibility = 'visible';
                    labels[nominal].textContent = count;
                } else {
                    slots[nominal].style.visibility = 'hidden';
                    labels[nominal].textContent = '';
                }
            }
        });

        txtMebleg.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                btnXirdala.click();
            }
        });
    </script>
</body>
</html>
